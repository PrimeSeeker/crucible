; Minimal pytest configuration.
;
; `-rs` is the whole point of this file: without it a self-skipping test
; prints as a bare `s` in the progress dots and its reason is never shown.
; A check that skips on a machine that cannot provide what it needs must
; not read as a pass, so the reasons are printed on every run.
;
; This file also fixes the rootdir, so `pytest` from anywhere inside the
; checkout resolves the same configuration.
[pytest]
testpaths = tests
addopts = -rs
